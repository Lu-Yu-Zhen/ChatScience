name: Deploy Pages

# 只把 sites/motai/public 发布为 GitHub Pages 站点（墨台产品页，含「壹 · 下载」页）。
# 全仓其它目录（docs/、app/、assets/、旧版单页 墨台产品页.html 等）不进入产物，
# 因此内部策划案、调研报告与源码都不会被公开。
on:
  push:
    branches: [master]
    paths:
      - "sites/motai/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/motai/public

      - id: deployment
        uses: actions/deploy-pages@v4
